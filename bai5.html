<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HR Management</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        
        .navbar { background: #333; color: white; padding: 15px; overflow: hidden; }
        .navbar b { font-size: 20px; }
        .navbar span { margin-left: 15px; color: #ccc; cursor: pointer; }
        .search-area { float: right; }
        .search-area input { padding: 5px; border-radius: 3px; border: none; }
        .search-area button { padding: 5px 10px; background: #555; color: white; border: none; cursor: pointer; }

        .container { width: 90%; margin: 20px auto; background: white; padding: 20px; box-shadow: 0 0 5px gray; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        .btn-edit { background: #ffc107; border: none; padding: 5px 10px; border-radius: 3px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; }

        .modal { width: 500px; margin: 30px auto; border: 1px solid #007bff; background: white; }
        .modal-h { background: #007bff; color: white; padding: 10px; }
        .modal-b { padding: 20px; }
        .row { margin-bottom: 10px; }
        .row div { display: inline-block; width: 48%; }
        input[type="text"], select { width: 100%; padding: 6px; box-sizing: border-box; }
        .modal-f { background: #eee; padding: 10px; text-align: right; }
        .btn-save { background: #28a745; color: white; border: none; padding: 7px 15px; }
        .btn-cancel { background: #6c757d; color: white; border: none; padding: 7px 15px; }
    </style>
</head>
<body>

    <div class="navbar">
        <b>HR Management</b> <span>Home</span> <span>Contact</span>
        <div class="search-area">
            <input type="text" placeholder="Search...">
            <button>Search</button>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <h2>Employee</h2>
            <button class="btn-add">+ Add</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Position</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Fatima Beatriz</td>
                    <td>fatima@gmail.com</td>
                    <td>0985674321</td>
                    <td>Staff</td>
                    <td>
                        <button class="btn-edit">Edit</button>
                        <button class="btn-delete">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Gabriel Hanna</td>
                    <td>gabriel@gmail.com</td>
                    <td>0353674231</td>
                    <td>Staff</td>
                    <td>
                        <button class="btn-edit">Edit</button>
                        <button class="btn-delete">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal">
        <div class="modal-h">New Employee</div>
        <div class="modal-b">
            <div class="row">
                <div><label>Name</label><br><input type="text"></div>
                <div><label>Email</label><br><input type="text"></div>
            </div>
            <div class="row">
                <div><label>Phone</label><br><input type="text"></div>
                <div>
                    <label>Position</label><br>
                    <select>
                        <option>Staff</option>
                        <option>Manager</option>
                    </select>
                </div>
            </div>
            <div>
                <label>Sex:</label>
                <input type="radio" name="g"> Male
                <input type="radio" name="g"> Female
            </div>
        </div>
        <div class="modal-f">
            <button class="btn-save">Save</button>
            <button class="btn-cancel">Cancel</button>
        </div>
    </div>

</body>
</html>
