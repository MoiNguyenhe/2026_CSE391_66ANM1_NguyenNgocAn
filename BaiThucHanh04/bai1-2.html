<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng Điểm Sinh Viên</title>
<link rel="stylesheet" href="bai1-2.css">
</head>

<body>

<div class="container">

<h2>Bảng Điểm Sinh Viên</h2>

<div class="input-group">
<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>
</div>

<input type="text" id="search" placeholder="Tìm sinh viên...">

<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="scoreHeader">Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<div class="stats">
Tổng SV: <span id="total">0</span> |
Điểm TB: <span id="avg">0</span>
</div>

</div>

<script src="bai1-2.js"></script>

</body>
</html>
