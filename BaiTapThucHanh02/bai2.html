<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Travel Goals Landing Page</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">TRAVEL GOALS</div>
            <ul class="nav-links">
                <li><a href="#">Destinations</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>JOE'S TRAVEL PAGE</h1>
                <p>LET'S EXPLORE THE WORLD TOGETHER</p>
                <button class="btn-discover">Discover places</button>
            </div>
        </section>

        <section class="highlights">
            <h2>HIGHLIGHTS</h2>
            <div class="card-container">
                <div class="card">
                    <img src="https://via.placeholder.com/300x150" alt="Miami">
                    <p>MIAMI <span>USA</span></p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150" alt="Munich">
                    <p>MUNICH <span>GERMANY</span></p>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150" alt="Barcelona">
                    <p>BARCELONA <span>SPAIN</span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-icons">
            <i class="fab fa-instagram"></i> <i class="fab fa-facebook"></i>
        </div>
    </footer>

</body>
</html>
